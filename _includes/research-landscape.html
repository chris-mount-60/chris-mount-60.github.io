<button class="mount-landscape" id="generate-ridge" type="button"
        aria-label="Generate a reflected Brownian mountain ridge"
        title="Click to generate a new mountain ridge">
  <img id="mount-sunset" src="{{ '/images/research-sunset-crimson.jpg' | relative_url }}"
       alt="">
  <svg viewBox="0 0 960 400" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="mount-fill" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#000000"/>
        <stop offset="1" stop-color="#180925"/>
      </linearGradient>
    </defs>
    <path id="mount-area" fill="url(#mount-fill)"/>
    <path id="mount-ridge" fill="none" stroke="#000000" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
  </svg>
</button>
<script src="{{ '/assets/js/research-landscape.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
